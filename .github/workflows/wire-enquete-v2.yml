name: Wire ENQUETE V2

on:
  push:
    branches:
      - feature/enquete-v2
    paths:
      - .github/workflows/wire-enquete-v2.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enquete-v2

      - name: Wire additive ENQUÊTE V2 assets
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = '<link rel="stylesheet" href="./style.css">'
          css_loader = css_anchor + '\n    <link rel="stylesheet" href="./enquete-v2.css">'
          if './enquete-v2.css' not in text:
              if css_anchor not in text:
                  raise SystemExit('style.css loader not found')
              text = text.replace(css_anchor, css_loader, 1)

          js_anchor = '<script src="./branding.js"></script>'
          js_loader = js_anchor + '\n    <script src="./enquete-v2.js"></script>'
          if './enquete-v2.js' not in text:
              if js_anchor not in text:
                  raise SystemExit('branding.js loader not found')
              text = text.replace(js_anchor, js_loader, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          node --check branding.js
          node --check enquete-v2.js
          grep -q 'enquete-v2.css' index.html
          grep -q 'enquete-v2.js' index.html
          grep -q 'PASSER AU JUGEMENT' index.html

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wire-enquete-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html enquete-v2.css enquete-v2.js .github/workflows/wire-enquete-v2.yml
          git commit -m 'feat: wire immersive ENQUÊTE V2 screen'
          git push origin feature/enquete-v2
