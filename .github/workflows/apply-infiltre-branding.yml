name: Apply INFILTRE branding loader

on:
  push:
    branches:
      - feature/infiltre-branding
    paths:
      - .github/workflows/apply-infiltre-branding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/infiltre-branding

      - name: Wire branding layer without touching game logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<title>Split</title>', '<title>INFILTRÉ</title>')

          old = '<script  src="./script.js"></script>'
          new = old + '\n    <script src="./branding.js"></script>'
          if './branding.js' not in text:
              if old not in text:
                  raise SystemExit('script.js loader not found in index.html')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          node --check branding.js
          grep -q '<title>INFILTRÉ</title>' index.html
          grep -q 'src="./branding.js"' index.html
          grep -q 'TRICHEUR' script.js

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-infiltre-branding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html branding.js .github/workflows/apply-infiltre-branding.yml
          git commit -m 'feat: wire INFILTRÉ branding without changing game engine'
          git push origin feature/infiltre-branding
